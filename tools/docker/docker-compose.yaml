version: "3.8"
services:
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
  logworker:
    build:
      context: ../..
      dockerfile: Dockerfile.LogWorker
    restart: always
    depends_on:
      - db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=customerapi;Username=postgres;Password=postgres
volumes:
  db:
    driver: local
